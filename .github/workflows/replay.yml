# Runs every step's check of every project in replay/ and compares what it prints with the stored hashes, on
# Linux, macOS and Windows, with the oldest Node and Python the projects ask for and with a current one.
name: replay

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: ${{ matrix.os }}, Node ${{ matrix.runtime.node }}, Python ${{ matrix.runtime.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime:
          - { node: "22.18", python: "3.10" }
          - { node: "lts/*", python: "3.x" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.runtime.python }}
      - run: node replay/run.mjs
